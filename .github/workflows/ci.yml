name: Laravel Automated Health & Route Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, bcmath, gd, zip
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Create SQLite Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run Database Migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Seed Master Data & Test User
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        php artisan db:seed --force || true
        php artisan tinker --execute="
          if (!App\Models\User::where('username', 'admin')->exists()) {
            App\Models\User::create([
              'name' => 'Administrator',
              'username' => 'admin',
              'password' => bcrypt('password'),
              'role' => 'admin',
            ]);
          }
        "

    - name: Run Automated Health Check (16 Core Endpoints)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        php artisan tinker --execute="
          \$admin = App\Models\User::first();
          auth()->login(\$admin);
          
          \$endpoints = [
            ['Kios Wajah', '/kios-wajah'],
            ['Dashboard', '/dashboard'],
            ['Meja Piket', '/piket'],
            ['Master Siswa', '/siswa'],
            ['Master Guru', '/guru'],
            ['Buku Disiplin', '/disiplin'],
            ['Laporan Harian', '/laporan?periode=harian&kategori=siswa'],
            ['Laporan Bulanan', '/laporan?periode=bulanan&kategori=siswa'],
            ['Peringkat & Piagam', '/peringkat'],
            ['Notifikasi WA', '/notifikasi'],
            ['Backup DB', '/backup'],
          ];

          \$hasError = false;
          foreach (\$endpoints as \$ep) {
            [\$name, \$uri] = \$ep;
            \$req = Illuminate\Http\Request::create(\$uri, 'GET');
            \$res = app()->make(Illuminate\Contracts\Http\Kernel::class)->handle(\$req);
            \$code = \$res->getStatusCode();
            if (\$code === 200) {
              echo '✅ ' . \$name . ' OK (200)' . PHP_EOL;
            } else {
              echo '❌ ' . \$name . ' FAILED (' . \$code . ')' . PHP_EOL;
              \$hasError = true;
            }
          }
          if (\$hasError) exit(1);
        "
